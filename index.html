<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>六六英语 · 碎片学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F1;
    --paper-deep:#F2ECE1;
    --ink:#2B2A28;
    --ink-soft:#57636B;
    --sage:#6B8F71;
    --sage-deep:#4F6E55;
    --coral:#E07856;
    --gold:#D9A441;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif; height:100%; overscroll-behavior:none;}
  body{display:flex; flex-direction:column; max-width:560px; margin:0 auto; min-height:100vh;}

  .display{font-family:'Fraunces',serif;}

  /* ---- Header ---- */
  header{padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
  .brand .sprout{color:var(--sage-deep);}
  .day-pill{font-size:12px; color:var(--ink-soft); background:var(--paper-deep); border:1px solid var(--line);
    padding:5px 10px; border-radius:20px;}

  main{flex:1; display:flex; flex-direction:column; min-height:0; position:relative;}
  .view{display:none; flex:1; min-height:0; flex-direction:column;}
  .view.active{display:flex;}

  /* ---- Today / Card stack view ---- */
  .stack-head{padding:2px 20px 10px; display:flex; align-items:baseline; justify-content:space-between;}
  .stack-title{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
  .stack-sub{font-size:13px; color:var(--ink-soft);}
  .progress-ring{width:34px; height:34px;}

  .stack-wrap{flex:1; position:relative; padding:6px 16px 10px; min-height:0;}
  .card-stack{position:relative; height:100%;}
  .word-card{
    position:absolute; inset:0; background:var(--card); border-radius:22px;
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(43,42,40,.04), 0 12px 28px rgba(43,42,40,.07);
    display:flex; flex-direction:column; padding:26px 22px 20px;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease;
    touch-action:pan-y;
  }
  .word-card .cat-tag{font-size:12px; color:var(--sage-deep); font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
  .word-card .main-word{font-family:'Fraunces',serif; font-weight:600; font-size:44px; line-height:1.08; margin:10px 0 2px; word-break:break-word;}
  .word-card .ipa{font-size:16px; color:var(--ink-soft); font-family:'Inter',sans-serif; letter-spacing:.3px;}
  .word-card .zh{margin-top:14px; font-size:18px; color:var(--ink); font-weight:500;}
  .word-card .note{margin-top:8px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .spacer{flex:1;}
  .sound-row{display:flex; gap:10px; margin-top:14px;}
  .sound-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    border:1px solid var(--line); background:var(--paper); border-radius:14px; padding:10px 6px;
    font-size:11px; color:var(--ink-soft); cursor:pointer; transition:background .15s;}
  .sound-btn .ic{font-size:20px;}
  .sound-btn:active{background:var(--paper-deep);}
  .sound-btn.playing{background:var(--sage); color:#fff; border-color:var(--sage);}
  .sound-btn.playing .ic{filter:none;}

  .card-actions{display:flex; gap:10px; margin-top:14px;}
  .act-btn{flex:1; padding:13px; border-radius:14px; text-align:center; font-weight:600; font-size:14px; cursor:pointer; border:none;}
  .act-learned{background:var(--sage); color:#fff;}
  .act-review{background:var(--paper-deep); color:var(--ink); border:1px solid var(--line);}

  .swipe-hint{text-align:center; font-size:12px; color:var(--ink-soft); padding:8px 0 4px; opacity:.8;}

  /* ---- Categories view ---- */
  .cat-list{padding:4px 16px 90px; overflow-y:auto;}
  .cat-section-title{font-size:13px; color:var(--ink-soft); margin:18px 6px 8px; font-weight:600; letter-spacing:.3px;}
  .cat-row{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .cat-emoji{font-size:24px; width:34px; text-align:center;}
  .cat-info{flex:1;}
  .cat-name{font-weight:600; font-size:15.5px;}
  .cat-count{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .cat-arrow{color:var(--ink-soft); font-size:18px;}

  /* ---- Quick lookup view ---- */
  .lookup-wrap{padding:14px 18px 90px; overflow-y:auto;}
  .search-box{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:12px 14px; margin-bottom:14px;}
  .search-box input{flex:1; border:none; outline:none; font-size:16px; background:transparent; color:var(--ink); font-family:'Inter',sans-serif;}
  .quick-tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .qtag{font-size:13px; padding:7px 13px; border-radius:20px; background:var(--paper-deep); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;}
  .lookup-result{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .lr-word{font-family:'Fraunces',serif; font-weight:600; font-size:21px;}
  .lr-ipa{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .lr-zh{font-size:13px; color:var(--ink-soft);}
  .lr-play{width:42px; height:42px; border-radius:50%; background:var(--coral); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .empty-state{text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 20px;}

  /* ---- Bottom nav ---- */
  nav.tabbar{position:sticky; bottom:0; background:rgba(251,247,241,.92); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; color:var(--ink-soft);
    font-size:11.5px; cursor:pointer; border-radius:12px; font-weight:500;}
  .tab .ic{font-size:21px;}
  .tab.active{color:var(--sage-deep);}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="sprout">●</span> 六六英语</div>
  <div style="display:flex; align-items:center; gap:8px;">
    <select id="voiceSelect" class="day-pill" style="border:1px solid var(--line); -webkit-appearance:none; appearance:none; padding-right:14px;"></select>
  </div>
</header>
<div style="padding:0 20px 8px;"><div class="day-pill" id="todayPill" style="display:inline-block;">今天 · 厨房物品</div></div>

<main>

  <!-- TODAY / STACK VIEW -->
  <section class="view active" id="view-today">
    <div class="stack-head">
      <div>
        <div class="stack-title" id="stackCatName">厨房物品</div>
        <div class="stack-sub" id="stackProgress">1 / 10</div>
      </div>
    </div>
    <div class="stack-wrap">
      <div class="card-stack" id="cardStack"></div>
    </div>
    <div class="swipe-hint">← 左滑标记需重复　｜　右滑/点击已学 →</div>
  </section>

  <!-- CATEGORIES VIEW -->
  <section class="view" id="view-categories">
    <div class="cat-list" id="catList"></div>
  </section>

  <!-- QUICK LOOKUP VIEW -->
  <section class="view" id="view-lookup">
    <div class="lookup-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" placeholder="搜场景或单词，比如「睡前」「狗」" />
      </div>
      <div class="quick-tags" id="quickTags"></div>
      <div id="lookupResults"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <div class="tab active" data-tab="today"><span class="ic">📇</span>今日学习</div>
  <div class="tab" data-tab="categories"><span class="ic">🗂️</span>全部分类</div>
  <div class="tab" data-tab="lookup"><span class="ic">⚡</span>速查</div>
</nav>

const STORE_KEY = "sixsix_en_v1";
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {learned:{}, review:{}, lastCat:null}; }
  catch(e){ return {learned:{}, review:{}, lastCat:null}; }
}
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
let store = loadStore();

function pickTodayCat(){
  if(store.lastCat && CAT_ORDER.includes(store.lastCat)){
    // rotate to next category each "today" session start (simple daily-ish rotation)
    const today = new Date().toDateString();
    if(store.lastDay === today) return store.lastCat;
    let idx = CAT_ORDER.indexOf(store.lastCat);
    let next = CAT_ORDER[(idx+1) % CAT_ORDER.length];
    store.lastCat = next; store.lastDay = today; saveStore();
    return next;
  }
  store.lastCat = CAT_ORDER[0]; store.lastDay = new Date().toDateString(); saveStore();
  return store.lastCat;
}

/* ===================== SPEECH ===================== */
let voices = [];
let selectedVoiceName = localStorage.getItem('sixsix_voice') || null;

function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v=> v.lang && v.lang.startsWith('en'));
  populateVoiceSelect();
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function populateVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if(!voices.length) return;
  // Prefer named premium voices if present
  const preferredNames = ['Samantha','Daniel','Ava'];
  const sorted = [...voices].sort((a,b)=>{
    const ap = preferredNames.findIndex(n=>a.name.includes(n));
    const bp = preferredNames.findIndex(n=>b.name.includes(n));
    const aScore = ap === -1 ? 99 : ap;
    const bScore = bp === -1 ? 99 : bp;
    return aScore - bScore;
  });
  sel.innerHTML = '';
  sorted.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name.replace(/\s*\(.*?\)\s*/g,'') + (v.lang ? ' · '+v.lang.replace('en-','') : '');
    sel.appendChild(opt);
  });
  if(selectedVoiceName && sorted.find(v=>v.name === selectedVoiceName)){
    sel.value = selectedVoiceName;
  } else if(sorted.length){
    selectedVoiceName = sorted[0].name;
    sel.value = selectedVoiceName;
  }
  sel.onchange = ()=>{
    selectedVoiceName = sel.value;
    localStorage.setItem('sixsix_voice', selectedVoiceName);
  };
}

function pickEnVoice(){
  return voices.find(v=>v.name === selectedVoiceName) ||
         voices.find(v=>v.lang && /en-US|en-GB/.test(v.lang)) ||
         voices[0];
}

function speak(text, mode, btnEl){
  speechSynthesis.cancel();
  let toSpeak = text.replace(/[!?,]/g,'');
  let rate = 1.0;
  if(mode === 'slow') rate = 0.55;
  if(mode === 'spell'){
    // letter-by-letter then whole word, only meaningful for single words
    const clean = text.replace(/[^a-zA-Z]/g,'');
    toSpeak = clean.split('').join('. ') + '.  ' + clean;
    rate = 0.7;
  }
  const utter = new SpeechSynthesisUtterance(toSpeak);
  utter.lang = 'en-US';
  utter.rate = rate;
  const v = pickEnVoice();
  if(v) utter.voice = v;
  if(btnEl){
    btnEl.classList.add('playing');
    utter.onend = ()=> btnEl.classList.remove('playing');
    utter.onerror = ()=> btnEl.classList.remove('playing');
  }
  speechSynthesis.speak(utter);
}

/* ===================== TODAY / STACK VIEW ===================== */
let currentCatKey = null;
let currentIdx = 0;

function renderStack(catKey){
  currentCatKey = catKey;
  currentIdx = 0;
  const cat = DATA[catKey];
  document.getElementById('stackCatName').textContent = cat.name;
  document.getElementById('todayPill').textContent = "今天 · " + cat.name;
  renderCardAt(currentIdx);
}

function renderCardAt(idx){
  const cat = DATA[currentCatKey];
  const stackEl = document.getElementById('cardStack');
  stackEl.innerHTML = '';
  document.getElementById('stackProgress').textContent = Math.min(idx+1, cat.items.length) + " / " + cat.items.length;

  if(idx >= cat.items.length){
    stackEl.innerHTML = `<div class="word-card" style="align-items:center;justify-content:center;text-align:center;">
      <div style="font-size:38px;margin-bottom:10px;">🌱</div>
      <div class="display" style="font-size:20px;font-weight:600;margin-bottom:6px;">这组学完了</div>
      <div style="color:var(--ink-soft);font-size:13.5px;">去「全部分类」挑下一组，或明天再来</div>
    </div>`;
    return;
  }

  const item = cat.items[idx];
  const itemId = currentCatKey + ':' + idx;
  const isLearned = !!store.learned[itemId];
  const card = document.createElement('div');
  card.className = 'word-card';
  card.innerHTML = `
    <div class="cat-tag">${cat.emoji} ${cat.name}</div>
    <div class="main-word">${item.w}</div>
    <div class="ipa">/${item.ipa}/</div>
    <div class="zh">${item.zh}</div>
    ${item.note ? `<div class="note">${item.note}</div>` : ''}
    <div class="spacer"></div>
    <div class="sound-row">
      <div class="sound-btn" data-mode="normal"><div class="ic">🔊</div>标准</div>
      <div class="sound-btn" data-mode="slow"><div class="ic">🐢</div>慢速</div>
      <div class="sound-btn" data-mode="spell"><div class="ic">🔤</div>拆音</div>
    </div>
    <div class="card-actions">
      <button class="act-btn act-review">需要重复</button>
      <button class="act-btn act-learned">${isLearned ? '已学 ✓' : '标记已学'}</button>
    </div>
  `;
  card.querySelectorAll('.sound-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> speak(item.w, btn.dataset.mode, btn));
  });
  card.querySelector('.act-learned').addEventListener('click', ()=>{
    store.learned[itemId] = true; saveStore();
    goNext();
  });
  card.querySelector('.act-review').addEventListener('click', ()=>{
    store.review[itemId] = true; saveStore();
    goNext();
  });

  // swipe handling
  let startX = 0, startY = 0, dx = 0, dragging = false;
  card.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  card.addEventListener('touchmove', e=>{
    if(!dragging) return;
    dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)){
      card.style.transform = `translateX(${dx}px) rotate(${dx/30}deg)`;
      card.style.opacity = 1 - Math.min(Math.abs(dx)/400, 0.5);
    }
  }, {passive:true});
  card.addEventListener('touchend', ()=>{
    dragging = false;
    if(dx > 90){
      store.learned[itemId] = true; saveStore();
      card.style.transform = `translateX(600px) rotate(20deg)`;
      card.style.opacity = 0;
      setTimeout(goNext, 180);
    } else if(dx < -90){
      store.review[itemId] = true; saveStore();
      card.style.transform = `translateX(-600px) rotate(-20deg)`;
      card.style.opacity = 0;
      setTimeout(goNext, 180);
    } else {
      card.style.transform = ''; card.style.opacity = 1;
    }
    dx = 0;
  });

  stackEl.appendChild(card);
}

function goNext(){
  currentIdx++;
  renderCardAt(currentIdx);
}

/* ===================== CATEGORIES VIEW ===================== */
function renderCategories(){
  const listEl = document.getElementById('catList');
  listEl.innerHTML = '';
  const groups = {};
  CAT_ORDER.forEach(key=>{
    const c = DATA[key];
    if(!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(key);
  });
  Object.keys(groups).forEach(groupName=>{
    const h = document.createElement('div');
    h.className = 'cat-section-title';
    h.textContent = groupName;
    listEl.appendChild(h);
    groups[groupName].forEach(key=>{
      const c = DATA[key];
      const learnedCount = c.items.filter((_,i)=>store.learned[key+':'+i]).length;
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <div class="cat-emoji">${c.emoji}</div>
        <div class="cat-info">
          <div class="cat-name">${c.name}</div>
          <div class="cat-count">${c.items.length} 条 · 已学 ${learnedCount}</div>
        </div>
        <div class="cat-arrow">›</div>
      `;
      row.addEventListener('click', ()=>{
        store.lastCat = key; store.lastDay = new Date().toDateString(); saveStore();
        switchTab('today');
        renderStack(key);
      });
      listEl.appendChild(row);
    });
  });
}

  const flat = [];
  CAT_ORDER.forEach(key=>{
    DATA[key].items.forEach(item=> flat.push({...item, catName: DATA[key].name, catKey:key}));
  });
  return flat;
}
const FLAT_ITEMS = allItemsFlat();

function doSearch(q){
  const resultsEl = document.getElementById('lookupResults');
  resultsEl.innerHTML = '';
  q = q.trim().toLowerCase();

  let results;
  if(!q){
    results = [];
  } else if(TAG_MAP[q]){
    results = DATA[TAG_MAP[q]].items.map(item=>({...item, catName: DATA[TAG_MAP[q]].name}));
  } else {
    results = FLAT_ITEMS.filter(it =>
      it.w.toLowerCase().includes(q) || it.zh.includes(q) || it.catName.includes(q)
    );
  }

  if(!q){
    resultsEl.innerHTML = `<div class="empty-state">输入场景或单词，比如「睡前」「狗」「水」</div>`;
    return;
  }
  if(results.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">没找到，换个词试试</div>`;
    return;
  }
  results.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'lookup-result';
    row.innerHTML = `
      <div>
        <div class="lr-word">${item.w}</div>
        <div class="lr-ipa">/${item.ipa}/ · <span class="lr-zh">${item.zh}</span></div>
      </div>
      <button class="lr-play">🔊</button>
    `;
    row.querySelector('.lr-play').addEventListener('click', (e)=> speak(item.w, 'normal', e.currentTarget));
    resultsEl.appendChild(row);
  });
}

document.getElementById('searchInput').addEventListener('input', e=> doSearch(e.target.value));

/* ===================== TAB SWITCHING ===================== */
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  if(tab === 'categories') renderCategories();
  if(tab === 'lookup'){ renderQuickTags(); doSearch(document.getElementById('searchInput').value); }
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> switchTab(t.dataset.tab));
});

/* ===================== INIT ===================== */
renderStack(pickTodayCat());
</script>
